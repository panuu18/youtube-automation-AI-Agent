name: YouTube Automation Bot

on:
  schedule:
    # 8:30 AM UTC = 2:00 PM IST (After school/college)
    - cron: '30 8 * * *'
    # 1:30 PM UTC = 7:00 PM IST (Evening prime time)
    - cron: '30 13 * * *'
  workflow_dispatch: # This line adds a button so you can trigger it manually!

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install FFmpeg (For Video Editing)
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install Python Libraries
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Reconstruct Secure Credentials
      env:
        CLIENT_SECRET_B64: ${{ secrets.CLIENT_SECRET_B64 }}
        TOKEN_PICKLE_B64: ${{ secrets.TOKEN_PICKLE_B64 }}
      run: |
        echo "$CLIENT_SECRET_B64" | base64 --decode > client_secret.json
        echo "$TOKEN_PICKLE_B64" | base64 --decode > token.pickle

    - name: Run Viral Clipper Bot
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python modules/clipper.py
